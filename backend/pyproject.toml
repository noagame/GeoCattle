[project]
name = "geocattle-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.6,<3", "argon2-cffi>=23.1,<26", "paho-mqtt>=2.1,<3", "httpx>=0.27,<1", "cryptography>=46,<47"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["geocattle*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
