name: ${COMPOSE_PROJECT_NAME:-geocattle-simulation}

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-backend: &backend
  image: ${COMPOSE_PROJECT_NAME:-geocattle-simulation}-backend:0.1.0
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: runtime
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-geocattle}:${POSTGRES_PASSWORD:?Ejecute scripts/configure.py}@database:5432/${POSTGRES_DB:-geocattle_simulation}
    APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Ejecute scripts/configure.py}
    APP_ENV: ${APP_ENV:-simulation}
    SIMULATION_ENABLED: ${SIMULATION_ENABLED:-true}
    SESSION_SECRET: ${SESSION_SECRET:?Ejecute scripts/configure.py}
    MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
    ADMIN_LOGIN_MFA: ${ADMIN_LOGIN_MFA:-false}
    INGEST_KEY: ${INGEST_KEY:?Ejecute scripts/configure.py}
    DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
    SESSION_HOURS: ${SESSION_HOURS:-12}
    MQTT_HOST: broker
    MQTT_PORT: 1883
    MQTT_USERNAME: ${MQTT_USERNAME:-geocattle}
    MQTT_PASSWORD: ${MQTT_PASSWORD:?Ejecute scripts/configure.py}
    MQTT_TOPIC: ${MQTT_TOPIC:-application/+/device/+/event/up}
    MQTT_ACK_TOPIC: ${MQTT_ACK_TOPIC:-geocattle/academic/committed}
    MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-geocattle-ingestor}
    MQTT_TLS: ${MQTT_TLS:-false}
    MQTT_SPOOL_PATH: /data/mqtt-spool.sqlite3
    PREVENTIVE_RULES_VALIDATED: ${PREVENTIVE_RULES_VALIDATED:-false}
    PROTOTYPE_TEMPERATURE_ENABLED: ${PROTOTYPE_TEMPERATURE_ENABLED:-false}
    WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-15}
    CONFIG_TIMEOUT_SECONDS: ${CONFIG_TIMEOUT_SECONDS:-3600}
    CONFIG_DOWNLINK_ENABLED: ${CONFIG_DOWNLINK_ENABLED:-false}
    CONFIG_CODEC_VALIDATED: ${CONFIG_CODEC_VALIDATED:-false}
    CHIRPSTACK_APPLICATION_ID: ${CHIRPSTACK_APPLICATION_ID:-}
    CONFIG_FPORT: ${CONFIG_FPORT:-10}
    NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
    NOTIFICATION_WEBHOOK_TOKEN: ${NOTIFICATION_WEBHOOK_TOKEN:-}
    INVITATION_EMAIL_ENABLED: ${INVITATION_EMAIL_ENABLED:-false}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-}
    SMTP_TLS_MODE: ${SMTP_TLS_MODE:-ssl}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM: ${SMTP_FROM:-}
    SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-8}
    GMAIL_SMTP_FROM: ${GMAIL_SMTP_FROM:-}
    GMAIL_SMTP_APP_PASSWORD: ${GMAIL_SMTP_APP_PASSWORD:-}
    INVITATION_BASE_URL: ${INVITATION_BASE_URL:-}
    NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-3}
    NOTIFICATION_EXPIRY_HOURS: ${NOTIFICATION_EXPIRY_HOURS:-24}
  restart: unless-stopped
  mem_limit: 256m
  cpus: 0.75
  logging: *logging
  security_opt:
    - no-new-privileges:true

services:
  database:
    image: postgis/postgis:16-3.4
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=2MB
      - -c
      - max_connections=40
      - -c
      - maintenance_work_mem=48MB
      - -c
      - autovacuum_work_mem=24MB
      - -c
      - autovacuum_max_workers=2
      - -c
      - max_parallel_workers_per_gather=1
    mem_limit: 384m
    cpus: 1.0
    shm_size: 128m
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geocattle_simulation}
      POSTGRES_USER: ${POSTGRES_USER:-geocattle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecute scripts/configure.py}
    ports:
      - 127.0.0.1:${DB_PORT:-55432}:5432
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      # The temporary server used by initdb only accepts Unix socket connections.
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    restart: unless-stopped

  migrate:
    <<: *backend
    command: [python, -m, geocattle.migrate]
    depends_on:
      database:
        condition: service_healthy
    restart: 'no'

  api:
    <<: *backend
    mem_limit: 384m
    cpus: 1.0
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+psycopg://geocattle_app:${APP_DATABASE_PASSWORD:?Ejecute scripts/configure.py}@database:5432/${POSTGRES_DB:-geocattle_simulation}
    command: [uvicorn, geocattle.main:app, --host, 0.0.0.0, --port, '8000', --workers, '1']
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/v1/health", timeout=3)']
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 15s

  worker:
    <<: *backend
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+psycopg://geocattle_app:${APP_DATABASE_PASSWORD:?Ejecute scripts/configure.py}@database:5432/${POSTGRES_DB:-geocattle_simulation}
    command: [python, -m, geocattle.worker]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: infrastructure/web.Dockerfile
    mem_limit: 64m
    cpus: 0.5
    logging: *logging
    ports:
      - 127.0.0.1:${WEB_PORT:-8080}:80
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/api/v1/health']
      interval: 20s
      timeout: 5s
      retries: 6
    volumes:
      - ./.runtime/mapa-satelital:/var/lib/geocattle/mapa-satelital:ro
      - ./.runtime/mapa-osm:/var/lib/geocattle/mapa-osm:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  seed:
    <<: *backend
    profiles: [tools]
    environment:
      <<: *backend-env
      V3_ADMIN_PASSWORD: ${V3_ADMIN_PASSWORD:-}
    command: [python, -m, geocattle.seed]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  bootstrap:
    <<: *backend
    profiles: [tools]
    environment:
      <<: *backend-env
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    command: [python, -m, geocattle.bootstrap]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  tls:
    image: caddy:2-alpine
    profiles: [tls]
    mem_limit: 128m
    cpus: 0.5
    logging: *logging
    ports:
      - 127.0.0.1:${TLS_PORT:-8443}:443
    volumes:
      - ./infrastructure/Caddyfile:/etc/caddy/Caddyfile:ro
      - tls-data:/data
      - tls-config:/config
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

  broker:
    image: eclipse-mosquitto:2.0
    profiles: [iot]
    mem_limit: 64m
    cpus: 0.5
    logging: *logging
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-geocattle}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Ejecute scripts/configure.py}
    entrypoint: [/bin/sh, /opt/geocattle/broker-entrypoint.sh]
    ports:
      - 127.0.0.1:${MQTT_PORT:-1884}:1883
    volumes:
      - ./infrastructure/mosquitto:/opt/geocattle:ro
      - broker-data:/mosquitto/data
    restart: unless-stopped

  ingestor:
    <<: *backend
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+psycopg://geocattle_app:${APP_DATABASE_PASSWORD:?Ejecute scripts/configure.py}@database:5432/${POSTGRES_DB:-geocattle_simulation}
    profiles: [iot]
    command: [python, -m, geocattle.ingestor]
    volumes:
      - ingestion-spool:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      broker:
        condition: service_started

  chirpstack-database:
    image: postgres:16-alpine
    profiles: [lorawan]
    command: [postgres, -c, shared_buffers=32MB, -c, work_mem=2MB, -c, max_connections=30,
              -c, maintenance_work_mem=32MB, -c, autovacuum_work_mem=16MB, -c, autovacuum_max_workers=2]
    mem_limit: 256m
    cpus: 0.75
    logging: *logging
    environment:
      POSTGRES_DB: chirpstack
      POSTGRES_USER: chirpstack
      POSTGRES_PASSWORD: ${CHIRPSTACK_DB_PASSWORD:?Ejecute scripts/configure.py}
    volumes:
      - chirpstack-database-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U chirpstack -d chirpstack']
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    restart: unless-stopped

  chirpstack-init:
    image: postgres:16-alpine
    profiles: [lorawan]
    mem_limit: 64m
    cpus: 0.5
    logging: *logging
    environment:
      PGPASSWORD: ${CHIRPSTACK_DB_PASSWORD:?Ejecute scripts/configure.py}
    command: [psql, --host, chirpstack-database, --username, chirpstack, --dbname, chirpstack, -v, ON_ERROR_STOP=1, -c, 'CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS hstore;']
    depends_on:
      chirpstack-database:
        condition: service_healthy
    restart: 'no'

  redis:
    image: redis:7-alpine
    profiles: [lorawan]
    mem_limit: 256m
    cpus: 0.5
    logging: *logging
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis-data:/data
    restart: unless-stopped

  chirpstack:
    image: chirpstack/chirpstack:4
    profiles: [lorawan]
    mem_limit: 256m
    cpus: 1.0
    logging: *logging
    command: [-c, /etc/chirpstack]
    environment:
      CHIRPSTACK_DB_PASSWORD: ${CHIRPSTACK_DB_PASSWORD:?Ejecute scripts/configure.py}
      CHIRPSTACK_API_SECRET: ${CHIRPSTACK_API_SECRET:?Ejecute scripts/configure.py}
      MQTT_USERNAME: ${MQTT_USERNAME:-geocattle}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Ejecute scripts/configure.py}
    ports:
      - 127.0.0.1:${CHIRPSTACK_PORT:-8081}:8080
    volumes:
      - ./infrastructure/chirpstack:/etc/chirpstack:ro
    depends_on:
      chirpstack-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  database-data:
  broker-data:
  ingestion-spool:
  chirpstack-database-data:
  redis-data:
  tls-data:
  tls-config:
