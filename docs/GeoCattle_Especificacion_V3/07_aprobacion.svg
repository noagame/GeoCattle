<text x="1120" y="285" font-family="sans-serif" font-size="15" font-weight="400" fill="#17384d" text-anchor="middle">AUX-01 · Persistir propuesta</text><text x="1120" y="305" font-family="sans-serif" font-size="15" font-weight="400" fill="#17384d" text-anchor="middle">y notificar al dueño</text>
<ellipse cx="1120" cy="555" rx="165.0" ry="42.0" fill="#f5edf9" stroke="#526e85" stroke-width="1.4"/>
<text x="1120" y="550" font-family="sans-serif" font-size="15" font-weight="400" fill="#17384d" text-anchor="middle">AUX-02 · Aplicar cambio con</text><text x="1120" y="570" font-family="sans-serif" font-size="15" font-weight="400" fill="#17384d" text-anchor="middle">decisión y auditoría</text>
<ellipse cx="1120" cy="820" rx="165.0" ry="42.0" fill="#f5edf9" stroke="#526e85" stroke-width="1.4"/>
<text x="1120" y="815" font-family="sans-serif" font-size="15" font-weight="400" fill="#17384d" text-anchor="middle">AUX-03 · Aplicar directamente</text><text x="1120" y="835" font-family="sans-serif" font-size="15" font-weight="400" fill="#17384d" text-anchor="middle">por confianza</text>
<circle cx="125" cy="210.0" r="17" fill="white" stroke="#294b61" stroke-width="2"/>
<path d="M125 227.0 V277.0 M96 244.0 H154 M125 277.0 L101 310.0 M125 277.0 L149 310.0" fill="none" stroke="#294b61" stroke-width="2"/>
