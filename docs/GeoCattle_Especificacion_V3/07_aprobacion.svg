<circle cx="125" cy="580.0" r="17" fill="white" stroke="#294b61" stroke-width="2"/>
<path d="M125 597.0 V647.0 M96 614.0 H154 M125 647.0 L101 680.0 M125 647.0 L149 680.0" fill="none" stroke="#294b61" stroke-width="2"/>
<text x="125" y="709.0" font-family="sans-serif" font-size="15" font-weight="700" fill="#17384d" text-anchor="middle">Dueño</text>
<path d="M 880.0 210 L 955.0 290" fill="none" stroke="#7b3e94" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="917.5" y="241.0" font-family="sans-serif" font-size="11" font-weight="400" fill="#7b3e94" text-anchor="middle">«include»</text>
<path d="M 880.0 315 L 955.0 290" fill="none" stroke="#7b3e94" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="917.5" y="293.5" font-family="sans-serif" font-size="11" font-weight="400" fill="#7b3e94" text-anchor="middle">«include»</text>
<path d="M 880.0 420 L 955.0 290" fill="none" stroke="#7b3e94" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="917.5" y="346.0" font-family="sans-serif" font-size="11" font-weight="400" fill="#7b3e94" text-anchor="middle">«include»</text>
<path d="M 955.0 555 L 880.0 525" fill="none" stroke="#7b3e94" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="917.5" y="531.0" font-family="sans-serif" font-size="11" font-weight="400" fill="#7b3e94" text-anchor="middle">«extend»</text><text x="917.5" y="547.0" font-family="sans-serif" font-size="11" font-weight="400" fill="#7b3e94" text-anchor="middle">[dueño aprueba]</text>
<path d="M 1285.0 820 H 1430 V 290 H 1285.0" fill="none" stroke="#7b3e94" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="1430" y="555.0" font-family="sans-serif" font-size="11" font-weight="400" fill="#7b3e94" text-anchor="middle">«extend»</text><text x="1430" y="571.0" font-family="sans-serif" font-size="11" font-weight="400" fill="#7b3e94" text-anchor="middle">[confianza vigente]</text>
<path d="M 1285.0 820 H 1340 V 555 H 1285.0" fill="none" stroke="#7b3e94" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/>
<text x="1340" y="687.5" font-family="sans-serif" font-size="11" font-weight="400" fill="#7b3e94" text-anchor="middle">«include»</text>
<text x="40" y="1080" font-family="sans-serif" font-size="13" font-weight="400" fill="#435d70" text-anchor="start">Las solicitudes persisten sin modificar la ficha efectiva hasta una decisión autorizada.</text>
<text x="40" y="1105" font-family="sans-serif" font-size="13" font-weight="400" fill="#435d70" text-anchor="start">«include» significa comportamiento obligatorio; «extend» significa una extensión condicional.</text>
<text x="40" y="1130" font-family="sans-serif" font-size="13" font-weight="400" fill="#435d70" text-anchor="start">La aplicación directa por confianza es una alternativa; no hereda permisos adicionales.</text>
<text x="40" y="1155" font-family="sans-serif" font-size="13" font-weight="400" fill="#435d70" text-anchor="start">La revisión/aplicación incluye control de versión, auditoría e idempotencia.</text>
</svg>