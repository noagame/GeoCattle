<text x="650" y="310" font-family="sans-serif" font-size="15" font-weight="400" fill="#17384d" text-anchor="middle">CU-18 · Solicitar estado o reporte del</text><text x="650" y="330" font-family="sans-serif" font-size="15" font-weight="400" fill="#17384d" text-anchor="middle">bovino</text>
