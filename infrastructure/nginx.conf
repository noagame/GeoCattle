map $uri $local_map_cache {
    default "";
    ~^/mapa-local/(satelite|osm)/manifest\.json$ no-cache;
    ~^/mapa-local/(satelite|osm)/[0-9]+/[0-9]+/[0-9]+\.(webp|png)$ "public, max-age=86400";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control $local_map_cache;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location ^~ /mapa-local/satelite/ {
        alias /var/lib/geocattle/mapa-satelital/;
        disable_symlinks on from=$document_root;
        try_files $uri =404;
    }
    location ^~ /mapa-local/osm/ {
        alias /var/lib/geocattle/mapa-osm/;
        disable_symlinks on from=$document_root;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

