map $uri $local_map_cache {
    default "";
    ~^/mapa-local/(satelite|osm)/manifest\.json$ no-cache;
    ~^/mapa-local/(satelite|osm)/[0-9]+/[0-9]+/[0-9]+\.(webp|png)$ "public, max-age=86400";
}

# Only the connector can supply Cloudflare client metadata. Use the peer
# address before real_ip processing when deciding whether to trust the scheme.
geo $realip_remote_addr $from_cloudflare {
    default 0;
    172.30.248.18 1;
}

map "$from_cloudflare:$http_x_forwarded_proto" $client_scheme {
    default $scheme;
    "1:https" https;
    "1:http" http;
}

map $client_scheme $strict_transport_security {
    default "";
    https "max-age=31536000";
}

# Track API container replacements without restarting nginx.
upstream geocattle_api {
    zone geocattle_api 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server api:8000 resolve;
}

server {
    listen 80;
    server_name _;
    absolute_redirect off;
    set_real_ip_from 172.30.248.18;
    real_ip_header CF-Connecting-IP;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;
    server_tokens off;
    add_header Strict-Transport-Security $strict_transport_security always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://server.arcgisonline.com; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control $local_map_cache;
    location /api/ {
        proxy_pass http://geocattle_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $client_scheme;
        proxy_read_timeout 30s;
    }
    location ^~ /mapa-local/satelite/ {
        alias /var/lib/geocattle/mapa-satelital/;
        disable_symlinks on from=$document_root;
        try_files $uri =404;
    }
    location ^~ /mapa-local/osm/ {
        alias /var/lib/geocattle/mapa-osm/;
        disable_symlinks on from=$document_root;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

